"""Control room dashboard - real-time agent observability."""

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 Agentic SDLC Control Room</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Monaco', 'Menlo', monospace;
            background: #0a0e27;
            color: #e0e0e0;
            padding: 20px;
            overflow-x: hidden;
        }

        .header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .header h1 {
            font-size: 32px;
            color: #fff;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .metric {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
        }

        .metric-label {
            font-size: 12px;
            color: #a0a0a0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .metric-value {
            font-size: 28px;
            color: #fff;
            font-weight: bold;
            margin-top: 5px;
        }

        .agents-container {
            display: grid;
            gap: 20px;
            margin-bottom: 20px;
        }

        .agent-card {
            background: #1a1f3a;
            border: 2px solid #2a3f5f;
            border-radius: 10px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .agent-card.active {
            border-color: #4CAF50;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.3);
        }

        .agent-card.thinking {
            border-color: #2196F3;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 20px rgba(33, 150, 243, 0.3); }
            50% { box-shadow: 0 0 40px rgba(33, 150, 243, 0.6); }
        }

        .agent-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .agent-name {
            font-size: 20px;
            font-weight: bold;
            color: #fff;
        }

        .agent-status {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }

        .status-thinking { background: #2196F3; color: #fff; }
        .status-acting { background: #FF9800; color: #fff; }
        .status-completed { background: #4CAF50; color: #fff; }
        .status-failed { background: #f44336; color: #fff; }

        .agent-flow {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0;
            padding: 20px;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
        }

        .flow-node {
            flex: 1;
            text-align: center;
            position: relative;
        }

        .flow-box {
            background: #2a3f5f;
            border: 2px solid #3a4f6f;
            border-radius: 8px;
            padding: 15px;
            margin: 0 10px;
            transition: all 0.3s ease;
        }

        .flow-box.active {
            background: #2196F3;
            border-color: #42A5F5;
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(33, 150, 243, 0.5);
        }

        .flow-box .icon {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .flow-box .label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .flow-arrow {
            color: #4CAF50;
            font-size: 24px;
            animation: moveRight 1s infinite;
        }

        @keyframes moveRight {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(5px); }
        }

        .step-info {
            font-size: 14px;
            color: #a0a0a0;
            margin-top: 10px;
        }

        .current-action {
            background: rgba(33, 150, 243, 0.2);
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            border-left: 4px solid #2196F3;
        }

        .current-action .tool {
            color: #FF9800;
            font-weight: bold;
        }

        .live-trace {
            background: #1a1f3a;
            border: 2px solid #2a3f5f;
            border-radius: 10px;
            padding: 20px;
            max-height: 400px;
            overflow-y: auto;
        }

        .live-trace h2 {
            margin-bottom: 15px;
            color: #fff;
        }

        .trace-entry {
            padding: 10px;
            margin: 5px 0;
            border-left: 3px solid #4CAF50;
            background: rgba(0,0,0,0.3);
            border-radius: 4px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .trace-time {
            color: #757575;
            font-size: 12px;
        }

        .trace-agent {
            color: #2196F3;
            font-weight: bold;
        }

        .trace-message {
            margin-left: 10px;
        }

        .connection-status {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 1000;
        }

        .connected {
            background: #4CAF50;
            color: white;
        }

        .disconnected {
            background: #f44336;
            color: white;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1f3a;
        }

        ::-webkit-scrollbar-thumb {
            background: #2a3f5f;
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #3a4f6f;
        }
    </style>
</head>
<body>
    <!-- Connection Status -->
    <div id="connectionStatus" class="connection-status disconnected">
        ⚫ Connecting...
    </div>

    <!-- Header -->
    <div class="header">
        <h1>🚀 Agentic SDLC Control Room</h1>
        <div class="metrics">
            <div class="metric">
                <div class="metric-label">Active Agents</div>
                <div class="metric-value" id="activeAgents">0</div>
            </div>
            <div class="metric">
                <div class="metric-label">Total Executions</div>
                <div class="metric-value" id="totalExecutions">0</div>
            </div>
            <div class="metric">
                <div class="metric-label">Success Rate</div>
                <div class="metric-value" id="successRate">0%</div>
            </div>
            <div class="metric">
                <div class="metric-label">Avg Duration</div>
                <div class="metric-value" id="avgDuration">0s</div>
            </div>
        </div>
    </div>

    <!-- Active Agents -->
    <div id="agentsContainer" class="agents-container">
        <!-- Agents will be added dynamically -->
    </div>

    <!-- Live Trace -->
    <div class="live-trace">
        <h2>📊 Live Execution Trace</h2>
        <div id="traceLog">
            <div class="trace-entry">
                <span class="trace-time">[Waiting for agent activity...]</span>
            </div>
        </div>
    </div>

    <script>
        // WebSocket connection
        let ws = null;
        const agents = new Map();
        let stats = {
            activeAgents: 0,
            totalExecutions: 0,
            successfulExecutions: 0,
            totalDuration: 0
        };

        function connect() {
            ws = new WebSocket('ws://localhost:8000/ws/dashboard');
            
            ws.onopen = () => {
                console.log('Connected to agent system');
                updateConnectionStatus(true);
            };
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                handleAgentUpdate(data);
            };
            
            ws.onclose = () => {
                console.log('Disconnected from agent system');
                updateConnectionStatus(false);
                // Reconnect after 3 seconds
                setTimeout(connect, 3000);
            };
            
            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
            };
        }

        function updateConnectionStatus(connected) {
            const status = document.getElementById('connectionStatus');
            if (connected) {
                status.textContent = '🟢 Connected';
                status.className = 'connection-status connected';
            } else {
                status.textContent = '🔴 Disconnected';
                status.className = 'connection-status disconnected';
            }
        }

        function handleAgentUpdate(data) {
            const { event, agent_id, agent_name, step, total_steps, phase, tool, observation, status, error } = data;

            // Update agent card
            if (event === 'agent_started') {
                createAgentCard(agent_id, agent_name);
                stats.activeAgents++;
                addTraceEntry(agent_name, `🚀 Started execution`);
            } 
            else if (event === 'step_update') {
                updateAgentCard(agent_id, { step, total_steps, phase, tool, observation });
                
                if (phase === 'thinking') {
                    addTraceEntry(agent_name, `🤔 Thinking (step ${step}/${total_steps})...`);
                } else if (phase === 'acting') {
                    addTraceEntry(agent_name, `🔧 Calling tool: ${tool}`);
                } else if (phase === 'observing') {
                    addTraceEntry(agent_name, `👀 Observed: ${observation.substring(0, 50)}...`);
                }
            }
            else if (event === 'agent_completed') {
                completeAgentCard(agent_id, status);
                stats.activeAgents--;
                stats.totalExecutions++;
                if (status === 'success') {
                    stats.successfulExecutions++;
                    addTraceEntry(agent_name, `✅ Completed successfully!`);
                } else {
                    addTraceEntry(agent_name, `❌ Failed: ${error}`);
                }
            }

            updateMetrics();
        }

        function createAgentCard(agentId, agentName) {
            const container = document.getElementById('agentsContainer');
            
            const card = document.createElement('div');
            card.id = `agent-${agentId}`;
            card.className = 'agent-card active';
            card.innerHTML = `
                <div class="agent-header">
                    <div class="agent-name">${agentName}</div>
                    <div class="agent-status status-thinking">🤔 THINKING</div>
                </div>
                <div class="step-info">Step <span id="step-${agentId}">1</span>/<span id="total-${agentId}">10</span></div>
                <div class="agent-flow">
                    <div class="flow-node">
                        <div class="flow-box active" id="think-${agentId}">
                            <div class="icon">🧠</div>
                            <div class="label">Think</div>
                        </div>
                    </div>
                    <div class="flow-arrow">▶</div>
                    <div class="flow-node">
                        <div class="flow-box" id="act-${agentId}">
                            <div class="icon">⚡</div>
                            <div class="label">Act</div>
                        </div>
                    </div>
                    <div class="flow-arrow">▶</div>
                    <div class="flow-node">
                        <div class="flow-box" id="observe-${agentId}">
                            <div class="icon">👁️</div>
                            <div class="label">Observe</div>
                        </div>
                    </div>
                </div>
                <div class="current-action" id="action-${agentId}">
                    <div>Initializing...</div>
                </div>
            `;
            
            container.appendChild(card);
            agents.set(agentId, { name: agentName, element: card });
        }

        function updateAgentCard(agentId, { step, total_steps, phase, tool, observation }) {
            // Update step counter
            if (step) {
                document.getElementById(`step-${agentId}`).textContent = step;
            }
            if (total_steps) {
                document.getElementById(`total-${agentId}`).textContent = total_steps;
            }

            // Update flow boxes
            const phases = ['think', 'act', 'observe'];
            phases.forEach(p => {
                const box = document.getElementById(`${p}-${agentId}`);
                if (box) {
                    box.classList.toggle('active', p === phase);
                }
            });

            // Update status badge
            const card = document.getElementById(`agent-${agentId}`);
            const statusBadge = card.querySelector('.agent-status');
            
            if (phase === 'thinking') {
                statusBadge.textContent = '🤔 THINKING';
                statusBadge.className = 'agent-status status-thinking';
                card.className = 'agent-card thinking';
            } else if (phase === 'acting') {
                statusBadge.textContent = '⚡ ACTING';
                statusBadge.className = 'agent-status status-acting';
            }

            // Update current action
            const actionDiv = document.getElementById(`action-${agentId}`);
            if (tool) {
                actionDiv.innerHTML = `<div>Executing: <span class="tool">${tool}</span></div>`;
            } else if (observation) {
                const shortObs = observation.substring(0, 100);
                actionDiv.innerHTML = `<div>Result: ${shortObs}${observation.length > 100 ? '...' : ''}</div>`;
            }
        }

        function completeAgentCard(agentId, status) {
            const card = document.getElementById(`agent-${agentId}`);
            if (!card) return;

            const statusBadge = card.querySelector('.agent-status');
            
            if (status === 'success') {
                statusBadge.textContent = '✅ COMPLETED';
                statusBadge.className = 'agent-status status-completed';
                card.className = 'agent-card';
            } else {
                statusBadge.textContent = '❌ FAILED';
                statusBadge.className = 'agent-status status-failed';
                card.className = 'agent-card';
            }

            // Remove card after 10 seconds
            setTimeout(() => {
                card.style.opacity = '0';
                card.style.transform = 'translateX(-100%)';
                setTimeout(() => card.remove(), 500);
            }, 10000);
        }

        function addTraceEntry(agentName, message) {
            const traceLog = document.getElementById('traceLog');
            const time = new Date().toLocaleTimeString();
            
            const entry = document.createElement('div');
            entry.className = 'trace-entry';
            entry.innerHTML = `
                <span class="trace-time">[${time}]</span>
                <span class="trace-agent">${agentName}:</span>
                <span class="trace-message">${message}</span>
            `;
            
            traceLog.insertBefore(entry, traceLog.firstChild);
            
            // Keep only last 50 entries
            while (traceLog.children.length > 50) {
                traceLog.removeChild(traceLog.lastChild);
            }
        }

        function updateMetrics() {
            document.getElementById('activeAgents').textContent = stats.activeAgents;
            document.getElementById('totalExecutions').textContent = stats.totalExecutions;
            
            const successRate = stats.totalExecutions > 0 
                ? Math.round((stats.successfulExecutions / stats.totalExecutions) * 100)
                : 0;
            document.getElementById('successRate').textContent = successRate + '%';
            
            const avgDuration = stats.totalExecutions > 0
                ? Math.round(stats.totalDuration / stats.totalExecutions)
                : 0;
            document.getElementById('avgDuration').textContent = avgDuration + 's';
        }

        // Connect on page load
        connect();

        // Simulate updates for demo (remove in production)
        // setTimeout(() => {
        //     handleAgentUpdate({
        //         event: 'agent_started',
        //         agent_id: 'demo-1',
        //         agent_name: 'PR Reviewer #1'
        //     });
        // }, 2000);
    </script>
</body>
</html>
